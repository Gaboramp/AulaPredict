{% extends "base.html" %}
{% block titulo %}{{ titulo }} — AulaPredict{% endblock %}
{% block contenido %}
  <h1>{{ titulo }}</h1>
  <p class="destacado">{{ nombre }}</p>
  <p>{{ detalle }}</p>
  <form method="post" class="acciones">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="peligro">Confirmar eliminación</button>
    <a class="boton" href="{{ url_cancelar }}">Cancelar</a>
  </form>
{% endblock %}
